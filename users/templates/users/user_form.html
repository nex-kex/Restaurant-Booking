{% extends 'booking/base.html' %}

{% block title %}Редактировать{% endblock %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-2"></div>
        <div class="col-8">
            <div class="card border-primary m-4 p-3">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        {% if object %}
                        <button type="submit" class="btn btn-primary m-2">
                            Сохранить
                        </button>
                        {% elif user.is_authenticated %}
                            <a type="submit" class="btn btn-secondary m-2" href="{% url 'users:user-detail' user.pk %}">
                                Отмена
                            </a>
                        {% endif %}
                    </form>
                </div>
            </div>
        </div>
        <div class="col-2"></div>
    </div>
</div>

{% endblock %}
