{% extends 'booking/base.html' %}

{% block title %}Категория{% endblock %}

{% block content %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">
        {{ object.name }}
    </h1>
</div>

<div class="container">
    <div class="row">
        <div class="col-2"></div>
        <div class="col-8">
            <div class="card m-3">
                <div class="card-body">
                    <h3>Описание:</h3>
                    <p class="card-text">
                        {{ object.description }}
                    </p>
                    {% if object.comment %}
                    <h3>Комментарии:</h3>
                    <p class="card-text">
                        {{ object.comment }}
                    </p>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="col-2"></div>
    </div>
</div>

{% endblock %}
