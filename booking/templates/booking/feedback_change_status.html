{% extends 'booking/base.html' %}

{% block title %}Смена статуса{% endblock %}

{% block content %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">
        {{ object }}
    </h1>
</div>

<div class="container">
    <div class="row">
        <div class="col-2"></div>
        <div class="col-8">
            <div class="card m-3">
                <div class="card-body">

                    <h3>
                        Вы уверены, что хотите изменить статус обработки данной обратной связи?
                    </h3>

                    <form method="post" action="{% url 'booking:feedback-change-status' object.pk %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-success" type="submit">Да</button>
                        <a href="{% url 'booking:feedback-detail' object.pk %}" class="btn btn-outline-danger">Нет</a>
                    </form>

                </div>
            </div>
        </div>
        <div class="col-2"></div>
    </div>
</div>

{% endblock %}
